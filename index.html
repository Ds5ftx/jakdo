<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="웹 브라우저에서 쓰는 동적 기하 작도 앱">
<title>기하 작도판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=STIX+Two+Text:ital,wght@1,500;1,600&display=swap">
<style>
/* 레이아웃: 상단 메뉴막대 · 왼쪽 도구상자 · 가운데 작도 종이 · 하단 상태줄 (스케치패드 배치) */
:root {
  --bg: #e6eaef; --panel: #f5f7f9; --paper: #ffffff; --ink: #18212c; --muted: #5a6878; --line: #cdd5de;
  --accent: #1e5bb8; --accent-ink: #ffffff; --sel: #ee8a00; --hover: #2a8ad4;
  --grid: #e4e9ef; --axis: #8592a2; --chip: #eef3f8; --chip-line: #b7c3d0; --btn-bg: #ffffff; --btn-ink: #1c3352;
  --shadow: 0 10px 30px rgba(20, 30, 45, .16), 0 2px 6px rgba(20, 30, 45, .08);
  --f-ui: "IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  --f-math: "STIX Two Text", "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171d; --panel: #1a2129; --paper: #0f141a; --ink: #e4e9ef; --muted: #98a5b4; --line: #2b3541;
  --accent: #6c9fff; --accent-ink: #0b1220; --sel: #ffad42; --hover: #5ab6ff;
  --grid: #1c252f; --axis: #5d6b7c; --chip: #1c2733; --chip-line: #3a4858; --btn-bg: #1d2834; --btn-ink: #dbe6f2;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12171d; --panel: #1a2129; --paper: #0f141a; --ink: #e4e9ef; --muted: #98a5b4; --line: #2b3541;
  --accent: #6c9fff; --accent-ink: #0b1220; --sel: #ffad42; --hover: #5ab6ff;
  --grid: #1c252f; --axis: #5d6b7c; --chip: #1c2733; --chip-line: #3a4858; --btn-bg: #1d2834; --btn-ink: #dbe6f2;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35); color-scheme: dark; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto auto; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); position: relative; }
#top { display: flex; align-items: stretch; gap: 4px; border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 12px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; border-right: 1px solid var(--line); }
.brand svg { color: var(--accent); }
#menubar { display: flex; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
#menubar::-webkit-scrollbar { display: none; }
.mb { background: none; border: 0; padding: 9px 12px; font-size: 14px; cursor: default; white-space: nowrap; border-radius: 0; }
.mb:hover, .mb.open { background: var(--chip); }
.top-actions { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-left: 1px solid var(--line); }
.icon-btn { background: none; border: 0; width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--chip); color: var(--ink); }
#main { display: grid; grid-template-columns: auto 1fr; min-height: 0; }
#toolbox { display: flex; flex-direction: column; gap: 2px; padding: 6px 5px; border-right: 1px solid var(--line); overflow-y: auto; scrollbar-width: none; }
.tool { position: relative; width: 40px; height: 40px; border: 1px solid transparent; border-radius: 7px; background: none; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.tool:hover { background: var(--chip); }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tvar { position: absolute; right: 3px; bottom: 3px; border: 4px solid transparent; border-right-color: currentColor; border-bottom-color: currentColor; opacity: .6; }
.tsep { height: 1px; background: var(--line); margin: 4px 4px; flex: none; }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--paper); }
#cv { display: block; touch-action: none; }
#pagebar { display: flex; align-items: stretch; gap: 8px; border-top: 1px solid var(--line); background: var(--bg); min-width: 0; padding-left: 6px; }
#pages { display: flex; align-items: flex-start; gap: 2px; overflow-x: auto; scrollbar-width: thin; min-width: 0; flex: 1; padding-bottom: 4px; }
.ptab { position: relative; flex: none; display: flex; align-items: center; max-width: 220px; margin-top: -1px; padding: 6px 14px 7px; font-size: 13px; border: 1px solid transparent; border-top: 0; border-radius: 0 0 7px 7px; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
.ptab span { overflow: hidden; text-overflow: ellipsis; }
.ptab:hover { color: var(--ink); background: var(--chip); }
.ptab.on { background: var(--paper); color: var(--ink); border-color: var(--line); font-weight: 600; box-shadow: 0 2px 0 var(--accent) inset; }
.ptab.drop-l { box-shadow: 3px 0 0 var(--accent) inset; }
.ptab.drop-r { box-shadow: -3px 0 0 var(--accent) inset; }
.ptab-edit { width: 140px; padding: 1px 4px; font-size: 13px; }
.padd { flex: none; align-self: center; width: 28px; height: 26px; margin: 2px 0 4px 4px; border: 1px dashed var(--chip-line); border-radius: 6px; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.padd:hover { color: var(--accent); border-color: var(--accent); }
#page-count { align-self: center; padding-right: 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
#status { display: flex; gap: 16px; justify-content: space-between; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); min-width: 0; }
#status-hint { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status-sel { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink); }
#zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#zoom button { border: 0; background: none; width: 32px; height: 30px; cursor: pointer; font-size: 16px; color: var(--muted); }
#zoom button + button { border-top: 1px solid var(--line); }
#zoom button:hover { background: var(--chip); color: var(--ink); }
#motion { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px; box-shadow: var(--shadow); font-size: 13px; }
#motion select { font: inherit; font-size: 12.5px; border: 1px solid var(--chip-line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 3px 8px; max-width: 160px; }
#motion button { border: 0; background: var(--chip); border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
#motion { flex-wrap: wrap; justify-content: center; max-width: calc(100% - 70px); }
#motion-speed { min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
.menu { position: fixed; z-index: 50; min-width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; display: flex; flex-direction: column; }
.menu.sub { position: absolute; }
.mi { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 6px; text-align: left; background: none; border: 0; padding: 6px 10px 6px 6px; border-radius: 5px; font-size: 13.5px; cursor: default; white-space: nowrap; }
.mi:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); }
.mi:disabled { color: var(--muted); opacity: .55; }
.mi small { color: inherit; opacity: .7; }
.mi-k { font-size: 12px; opacity: .7; padding-left: 18px; }
.mi-chk { font-size: 12px; text-align: center; }
.mi-sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: middle; }
.msep { height: 1px; background: var(--line); margin: 4px 6px; }
.flyout { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; display: flex; flex-direction: column; }
.fo { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 6px 12px 6px 6px; border-radius: 5px; cursor: pointer; font-size: 13.5px; }
.fo:hover { background: var(--chip); }
.fo.on { background: var(--accent); color: var(--accent-ink); }
#infopop { position: absolute; z-index: 20; max-width: min(320px, 80%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 10px 12px; font-size: 13px; line-height: 1.55; display: grid; gap: 4px; }
.ip-kind { font-weight: 600; } .ip-def { color: var(--ink); } .ip-rel { color: var(--muted); } .ip-rel b { color: var(--ink); font-weight: 500; }
#scrim { position: absolute; inset: 0; background: rgba(10, 16, 24, .25); z-index: 30; }
.dlg { position: absolute; z-index: 40; left: 50%; top: 7%; transform: translateX(-50%); width: min(440px, calc(100% - 24px)); max-height: 86%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.dlg.modeless { top: 12%; left: auto; right: 24px; transform: none; z-index: 41; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); font-weight: 600; cursor: move; user-select: none; touch-action: none; }
.dlg-x { border: 0; background: none; font-size: 20px; line-height: 1; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.dlg-x:hover { background: var(--chip); }
.dlg-body { padding: 14px 16px; overflow-y: auto; min-height: 0; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
.btn { border: 1px solid var(--chip-line); background: var(--btn-bg); color: var(--ink); border-radius: 7px; padding: 6px 14px; cursor: pointer; font-size: 13.5px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.stack { display: grid; gap: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.fld { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.fld small { font-size: 11.5px; }
input[type=number], input:not([type]), select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--chip-line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.mono { font-family: var(--f-mono); }
.chk { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
.note { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.sub { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: inline-block; padding: 5px 10px; border: 1px solid var(--chip-line); border-radius: 999px; font-size: 13px; cursor: pointer; }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg .dis span { opacity: .45; cursor: not-allowed; }
.calc-out { font-family: var(--f-mono); font-size: 15px; min-height: 1.4em; color: var(--accent); }
.calc-out.err { color: #d6303c; font-family: var(--f-ui); font-size: 13px; }
.keypad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.keypad button { border: 1px solid var(--line); background: var(--btn-bg); border-radius: 5px; padding: 6px 0; font-family: var(--f-mono); font-size: 13px; cursor: pointer; }
.keypad button:hover { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 140px; overflow-y: auto; }
.chip { border: 1px solid var(--chip-line); background: var(--chip); border-radius: 6px; padding: 3px 8px; font-size: 12.5px; cursor: pointer; text-align: left; }
.chip b { font-family: var(--f-mono); font-weight: 500; color: var(--accent); }
.iter-map { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; font-size: 13.5px; }
.im-h { font-size: 12px; color: var(--muted); }
.im-c { font-family: var(--f-math); font-style: italic; font-size: 16px; }
.im-t { text-align: left; border: 1px solid var(--chip-line); background: var(--paper); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
.im-t.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.fx { display: flex; align-items: center; gap: 8px; }
.fx > input { flex: 1; }
.fx > span { white-space: nowrap; }
#txtpal { position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%); z-index: 22; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; max-width: calc(100% - 24px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px 8px; }
#txtpal select { width: auto; font-size: 12.5px; padding: 3px 6px; }
.tp-b, .tp-s, .tp-x { border: 1px solid var(--line); background: var(--btn-bg); border-radius: 5px; min-width: 26px; height: 26px; padding: 0 6px; cursor: pointer; font-size: 13px; }
.tp-s { font-family: var(--f-math); }
.tp-x { border: 0; background: none; color: var(--muted); font-size: 18px; }
.tp-sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
.sw.sm { width: 18px; height: 18px; border-width: 1.5px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel); background: var(--c); box-shadow: 0 0 0 1px var(--chip-line); cursor: pointer; }
.sw.on { box-shadow: 0 0 0 2px var(--accent); }
.arch { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; }
.arch-row { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; }
.arch-row b { display: block; font-weight: 500; } .arch-row small { color: var(--muted); font-size: 11.5px; }
.script li.cur { color: var(--accent); font-weight: 600; }
.script li.done { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.script ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; font-size: 13.5px; }
.help table { border-collapse: collapse; font-size: 13px; width: 100%; }
.help th { text-align: left; font-weight: 500; font-family: var(--f-mono); font-size: 12px; padding: 4px 10px 4px 0; white-space: nowrap; vertical-align: top; }
.help td { padding: 4px 0; color: var(--muted); }
.help p { margin: 0; font-size: 13.5px; line-height: 1.6; }
.inline-edit { position: absolute; z-index: 25; min-width: 160px; font: 15px var(--f-ui); background: var(--paper); color: var(--ink); border: 1.5px solid var(--accent); border-radius: 4px; padding: 3px 6px; box-shadow: var(--shadow); }
#balloon { position: absolute; z-index: 21; max-width: 260px; background: var(--ink); color: var(--paper); font-size: 12px; line-height: 1.45; padding: 5px 9px; border-radius: 6px; pointer-events: none; }
#stage.dropping { outline: 3px dashed var(--accent); outline-offset: -6px; }
#print-area { display: none; }
@media print { #app { display: none !important; } #print-area { display: block !important; } #print-area img { width: 100%; } #print-area h1 { font: 600 16px var(--f-ui); } body { padding: 0; background: #fff; } }
#toast { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; font-size: 13.5px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
@media (max-width: 640px) {
  .brand span { display: none; }
  #status-hint { display: none; }
  .tool { width: 36px; height: 36px; }
  .dlg.modeless { right: 12px; left: 12px; width: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="13" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v10l6.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="13" r="1.8" fill="currentColor"/></svg><span>기하 작도판</span></div>
    <nav id="menubar" role="menubar" aria-label="메뉴"></nav>
    <div class="top-actions">
      <button class="icon-btn" id="b-undo" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 7H4V2M4 7a9 9 0 1 1-1.2 7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <button class="icon-btn" id="b-redo" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 7h5V2M20 7a9 9 0 1 0 1.2 7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <button class="icon-btn" id="b-help" title="사용법과 단축키" aria-label="사용법과 단축키"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6V14M12 17v.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <div id="main">
    <aside id="toolbox" role="toolbar" aria-orientation="vertical" aria-label="도구상자"></aside>
    <div id="stage">
      <canvas id="cv" aria-label="작도 영역"></canvas>
      <div id="infopop" hidden></div>
      <div id="zoom"><button id="z-in" aria-label="확대">+</button><button id="z-out" aria-label="축소">−</button><button id="z-fit" aria-label="전체 보기" title="전체 보기">⤢</button></div>
      <div id="motion" hidden><button id="m-stop">■ 멈춤</button><button id="m-slow" aria-label="느리게">−</button><span id="motion-speed">×1</span><button id="m-fast" aria-label="빠르게">+</button></div>
    </div>
  </div>
  <div id="pagebar"><div id="pages" role="tablist" aria-label="페이지"></div><span id="page-count"></span></div>
  <footer id="status"><span id="status-hint"></span><span id="status-sel"></span></footer>
  <div id="scrim" hidden></div>
  <div id="toast" role="status" hidden></div>
</div>
<script id="jakdo-main">
'use strict';
const BOOT_HTML = document.documentElement.outerHTML;
let STORE_KEY = 'jakdo-book';
/* ================= 수학 유틸 ================= */
const TAU = Math.PI * 2, D2R = Math.PI / 180, PXCM = 37.795;
const vadd = (a, b) => ({ x: a.x + b.x, y: a.y + b.y }), vsub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const vmul = (a, k) => ({ x: a.x * k, y: a.y * k }), vlen = a => Math.hypot(a.x, a.y);
const vdot = (a, b) => a.x * b.x + a.y * b.y, vcross = (a, b) => a.x * b.y - a.y * b.x;
const vdist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const vnorm = a => { const l = vlen(a); return l < 1e-12 ? null : { x: a.x / l, y: a.y / l }; };

function L(id, name, show = true) { const o = obj(id); o.label = name; o.showLabel = show; return id; }
function hide(...ids) { ids.forEach(id => obj(id).hidden = true); }
function sty(id, s) { Object.assign(obj(id), s); return id; }
function text(t, sx, sy, extra = {}) { return add({ t: 'text', k: 'cap', d: { text: t, sx, sy, size: 14, ...extra }, color: 'gray' }).id; }
function placeVals(ids, x, y) { ids.forEach((id, i) => { const o = obj(id); o.d.sx = x; o.d.sy = y + i * 26; }); }

const EXAMPLES = [
  { name: '삼각형의 외심과 외접원', build() {
    const A = L(P(-4, -2.2), 'A'), B = L(P(4.2, -2.6), 'B'), C = L(P(0.8, 3.6), 'C');
    const sAB = mkStraight('segment', A, B), sBC = mkStraight('segment', B, C); mkStraight('segment', C, A);
    const M1 = L(mkMid(sAB), 'M', false), M2 = L(mkMid(sBC), 'N', false);
    sty(M1, { ps: 1, color: 'gray' }); sty(M2, { ps: 1, color: 'gray' });
    const p1 = sty(mkPerp(M1, sAB), { dash: 1, color: 'gray', w: 1 }), p2 = sty(mkPerp(M2, sBC), { dash: 1, color: 'gray', w: 1 });
    const O = L(mkInt(p1, p2, 0), 'O'); sty(O, { color: 'blue' });
    sty(mkCircle(O, A), { color: 'blue' });
    const d = [mkValue('dist', [O, A]), mkValue('dist', [O, B]), mkValue('dist', [O, C])];
    placeVals(d, 14, 14);
    text('두 변의 수직이등분선의 교점 O에서\n세 꼭짓점까지의 거리는 항상 같습니다.\n꼭짓점을 끌어 보세요.', 14, 100);
  } },
  { name: '오일러 직선', build() {
    const A = L(P(-4.8, -2.4), 'A'), B = L(P(5, -2.6), 'B'), C = L(P(-2.6, 3.9), 'C');
    const ab = mkStraight('segment', A, B), bc = mkStraight('segment', B, C), ca = mkStraight('segment', C, A);
    const Ma = sty(mkMid(bc), { ps: 1, color: 'gray', showLabel: false }), Mb = sty(mkMid(ca), { ps: 1, color: 'gray', showLabel: false }), Mc = sty(mkMid(ab), { ps: 1, color: 'gray', showLabel: false });
    const m1 = sty(mkStraight('segment', A, Ma), { w: 1, dash: 2, color: 'green' }), m2 = sty(mkStraight('segment', B, Mb), { w: 1, dash: 2, color: 'green' });
    const Gc = L(mkInt(m1, m2, 0), 'G'); sty(Gc, { color: 'green' });
    const h1 = sty(mkPerp(A, bc), { w: 1, dash: 1, color: 'orange' }), h2 = sty(mkPerp(B, ca), { w: 1, dash: 1, color: 'orange' });
    const Hh = L(mkInt(h1, h2, 0), 'H'); sty(Hh, { color: 'orange' });
    const q1 = sty(mkPerp(Mc, ab), { w: 1, dash: 1, color: 'blue' }), q2 = sty(mkPerp(Ma, bc), { w: 1, dash: 1, color: 'blue' });
    const O = L(mkInt(q1, q2, 0), 'O'); sty(O, { color: 'blue' });
    const e = sty(mkStraight('line', O, Hh), { w: 3, color: 'magenta' }); obj(e).label = 'e';
    const hg = mkValue('dist', [Hh, Gc]), go = mkValue('dist', [Gc, O]);
    placeVals([hg, go], 14, 14);
    const r = mkCalc(obj(hg).label + '/' + obj(go).label); placeVals([r], 14, 66);
    const b = add({ t: 'button', k: 'b', p: [m1, m2, h1, h2, q1, q2, Ma, Mb, Mc], d: { act: 'hide', sx: 14, sy: 102, text: '보조선 숨기기' } }).id;
    text('무게중심 G, 수심 H, 외심 O는 한 직선 위에 있고\nHG : GO = 2 : 1 입니다. 꼭짓점을 끌어 보세요.', 14, 142);
  } },
  { name: '타원 — 자취와 포락선', build() {
    const F1 = L(P(-2, 0), 'F₁'), R = L(P(4, 0), 'R', false); sty(R, { ps: 1 });
    const c = sty(mkCircle(F1, R), { color: 'gray', w: 1 });
    const Pp = L(mkOn(c, 0.2), 'P'); const F2 = L(P(2, 0.4), 'F₂');
    const s1 = sty(mkStraight('segment', F1, Pp), { w: 1, color: 'gray' }), s2 = sty(mkStraight('segment', F2, Pp), { w: 1, color: 'gray', dash: 1 });
    const M = sty(mkMid(s2), { ps: 1, showLabel: false, color: 'gray' });
    const pb = sty(mkPerp(M, s2), { color: 'teal', w: 1 });
    const X = L(mkInt(pb, s1, 0), 'X'); sty(X, { color: 'purple', ps: 3 });
    const loc = mkLocus(Pp, X); sty(loc, { color: 'purple', w: 3 });
    const env = mkLocus(Pp, pb); sty(env, { color: 'teal', w: 1 }); obj(env).hidden = true;
    const a = mkValue('dist', [F1, X]), b = mkValue('dist', [F2, X]); placeVals([a, b], 14, 14);
    const sum = mkCalc(obj(a).label + '+' + obj(b).label); placeVals([sum], 14, 66);
    add({ t: 'button', k: 'b', p: [Pp], d: { act: 'anim', sx: 14, sy: 100, text: 'P 움직이기' } });
    add({ t: 'button', k: 'b', p: [env], d: { act: 'hide', sx: 140, sy: 100, text: '포락선 보이기' } });
    text('F₂P의 수직이등분선과 F₁P의 교점 X의 자취는\nF₁, F₂를 초점으로 하는 타원입니다. (F₁X + F₂X = 반지름)', 14, 140);
  } },
  { name: '이차함수와 매개변수', build() {
    ensureCoord();
    const a = mkParam(1, { min: -3, max: 3, step: 0.1, label: 'a' }), p = mkParam(1, { min: -4, max: 4, step: 0.5, label: 'p' }), q = mkParam(-2, { min: -4, max: 4, step: 0.5, label: 'q' });
    placeVals([a, p, q], 14, 14);
    const f = mkFplot('a*(x-p)^2+q'); placeVals([obj(f).d.fn], 14, 98);
    const V = L(mkPlot({ v: p }, { v: q }), 'V'); sty(V, { color: 'orange' });
    const T = L(mkOn(f, 2.2), 'T'); const ct = mkValue('coords', [T]); placeVals([ct], 14, 124);
    add({ t: 'button', k: 'b', p: [a], d: { act: 'anim', sx: 14, sy: 158, text: 'a 바꾸기' } });
    text('매개변수를 선택하고 + / − 키를 누르거나\n더블클릭해서 값을 바꿔 보세요. 꼭짓점 V = (p, q)', 14, 198);
  } },
  { name: '사이클로이드', build() {
    const co = ensureCoord(); const O = obj(co).p[0]; obj(O).d.x = -6; obj(O).d.y = -2; obj(obj(co).p[1]).d.u = 1;
    const th = mkParam(60, { min: 0, max: 720, step: 15, label: 'th', unit: 'none' }); placeVals([th], 14, 14);
    const xc = mkCalc('th*pi/180'), xp = mkCalc('th*pi/180 - sin(th)'), yp = mkCalc('1 - cos(th)');
    placeVals([xc, xp, yp], 14, 46);
    const Cc = L(mkPlot({ v: xc }, 1), 'C'); sty(Cc, { color: 'gray', ps: 1 });
    const Pp = L(mkPlot({ v: xp }, { v: yp }), 'P'); sty(Pp, { color: 'red', ps: 3 });
    sty(mkCircle(Cc, Pp), { color: 'blue' });
    sty(mkStraight('segment', Cc, Pp), { color: 'blue', w: 1 });
    const loc = mkLocus(th, Pp); sty(loc, { color: 'purple', w: 3 });
    add({ t: 'button', k: 'b', p: [th], d: { act: 'anim', sx: 14, sy: 128, text: '원 굴리기' } });
    text('반지름 1인 원이 x축 위를 굴러갈 때\n원 위의 한 점 P가 그리는 곡선입니다.', 14, 168);
  } },
  { name: '시에르핀스키 삼각형 (반복)', build() {
    const A = L(P(-5, -3.6), 'A'), B = L(P(5, -3.6), 'B'), C = L(P(0, 5), 'C');
    const ab = mkStraight('segment', A, B), bc = mkStraight('segment', B, C), ca = mkStraight('segment', C, A);
    [ab, bc, ca].forEach(s => sty(s, { w: 1 }));
    const D = sty(L(mkMid(ab), 'D'), { ps: 1 }), E = sty(L(mkMid(bc), 'E'), { ps: 1 }), F = sty(L(mkMid(ca), 'F'), { ps: 1 });
    const pg = mkPoly([A, B, C], 'blue'); obj(pg).alpha = 0.35;
    const n = mkParam(4, { min: 0, max: 6, step: 1, label: 'n' }); placeVals([n], 14, 14);
    add({ t: 'iter', k: 'geo', p: [A, B, C, A, D, F, D, B, E, F, E, C, n], d: { pre: [A, B, C], maps: [[A, D, F], [D, B, E], [F, E, C]], depth: 4, depthV: n, final: true, ptsToo: false, drawHidden: true } }); obj(n).prec = 0;
    obj(pg).hidden = true; [ab, bc, ca].forEach(s => obj(s).hidden = true);
    add({ t: 'button', k: 'b', p: [pg, ab, bc, ca], d: { act: 'hide', sx: 14, sy: 50, text: '원래 삼각형 보이기' } });
    text('변환 ▸ 반복으로 A→A, B→D, C→F 등 세 사상을 지정해 만든 프랙털입니다.\n매개변수 n을 선택하고 + / − 키로 단계를 바꿔 보세요. 꼭짓점도 끌 수 있습니다.', 14, 90);
  } },
  { name: '회전 대칭 무늬', build() {
    const O = L(P(0, 0), 'O'); sty(O, { color: 'ink' });
    const A = L(P(1, 0.5), 'A'), B = L(P(3.6, 0.4), 'B'), Cc = L(P(2.4, 2.2), 'C');
    const cols = ['red', 'orange', 'gold', 'green', 'blue', 'purple'];
    let src = mkPoly([A, B, Cc], cols[0]); obj(src).alpha = 0.45;
    doc.marks.center = O;
    for (let i = 1; i < 6; i++) { const im = mkXf(src, { type: 'rot', c: O, ang: 60 }); obj(im).color = cols[i]; obj(im).alpha = 0.45; src = im; }
    text('삼각형을 점 O를 중심으로 60°씩 회전했습니다.\nA, B, C를 끌면 무늬 전체가 함께 바뀝니다.', 14, 14);
  } },
];
function loadExample(x, quiet) {
  addPage(x.name);
  view.s = clamp(Math.min(W, H) / 12.5, 22, 46); view.ox = W / 2 + (W > 700 ? 90 : 0); view.oy = H / 2 + 10;
  x.build(); dirty = true; recompute(); draw(); refresh();
  undoStack.length = 0; redoStack.length = 0;
  if (!quiet) toast('예제를 새 페이지로 열었습니다: ' + x.name);
}

/* ================= 시작 ================= */
function init() {
  readTheme(); buildMenubar(); buildToolbox();
  new ResizeObserver(resize).observe($('#stage')); resize();
  doc = newDoc(); reindex();
  let loaded = false;
  const emb = document.getElementById('jakdo-embed');
  if (emb) { let h = 0; for (const ch of emb.textContent) h = (h * 31 + ch.charCodeAt(0)) | 0; STORE_KEY = 'jakdo-book:emb:' + (h >>> 0).toString(36); }
  try {
    const s = localStorage.getItem(STORE_KEY) || (emb ? emb.textContent : null) || localStorage.getItem('jakdo-autosave');
    if (s) { const b = parseBook(s); if (!localStorage.getItem(STORE_KEY) && !emb) { const v = JSON.parse(localStorage.getItem('jakdo-view') || 'null'); if (v && v.s) b.pages[0].view = v; } if (b.pages.some(p => p.doc.objs.length)) { replaceBook(b); loaded = true; } }
  } catch (e) { loaded = false; }
  if (!loaded) { book = { pages: [], cur: 0, nextPid: 1 }; for (const x of EXAMPLES) loadExample(x, true); showPage(1); }
  setTool('arrow'); updateStatus(); refresh();
  const mq = matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener && mq.addEventListener('change', () => { readTheme(); requestDraw(); });
  new MutationObserver(() => { readTheme(); requestDraw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts) document.fonts.ready.then(() => requestDraw());
  $('#b-undo').onclick = undo; $('#b-redo').onclick = redo; $('#b-help').onclick = helpDlg;
  $('#z-in').onclick = () => zoomAt(W / 2, H / 2, 1.25); $('#z-out').onclick = () => zoomAt(W / 2, H / 2, 0.8);
  $('#z-fit').onclick = fitView;
  $('#m-stop').onclick = () => stopAnim(); $('#m-slow').onclick = () => { speedK = Math.max(0.1, speedK / 1.5); updateMotion(); }; $('#m-fast').onclick = () => { speedK = Math.min(8, speedK * 1.5); updateMotion(); };
}
function fitView() {
  const pts = []; for (const o of doc.objs) { if (o.hidden) continue; const g = G[o.id]; if (!g) continue; if (o.t === 'point') pts.push(g); else if (o.t === 'circle') pts.push(vsub(g.c, { x: g.r, y: g.r }), vadd(g.c, { x: g.r, y: g.r })); }
  if (!pts.length) { view.s = PXCM; view.ox = W / 2; view.oy = H / 2; refresh(); return; }
  const x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x)), y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
  const s = clamp(Math.min((W - 120) / Math.max(1, x1 - x0), (H - 120) / Math.max(1, y1 - y0)), 5, 400);
  view.s = s; view.ox = W / 2 - (x0 + x1) / 2 * s; view.oy = H / 2 + (y0 + y1) / 2 * s; refresh(); scheduleSave();
}
init();

</script>
